name: AgentRouter 自动签到

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 开启调试截图与详细日志
        required: false
        default: false
        type: boolean

jobs:
  checkin:
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      DEBUG_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 缓存 UV 依赖
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: 安装依赖
        run: uv sync --frozen

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont \
            fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf

      - name: 缓存 CloakBrowser
        uses: actions/cache@v5
        with:
          path: ~/.cloakbrowser
          key: ${{ runner.os }}-cloakbrowser-v1
          restore-keys: |
            ${{ runner.os }}-cloakbrowser-

      - name: 安装 CloakBrowser
        run: uv run python -m cloakbrowser install

      - name: 配置代理
        env:
          PROXY_SUBSCRIPTION_URL: ${{ secrets.AGENTROUTER_PROXY_SUBSCRIPTION_URL }}
          PROXY_TEST_URL: https://agentrouter.org/login
          PROXY_STATUS_URL: https://agentrouter.org/api/status
          MIHOMO_VERSION: v1.19.27
          PROXY_REQUIRED: true
          PROXY_MAX_CANDIDATES: 160
          PROXY_CANDIDATE_TIMEOUT: 12
        run: bash scripts/setup_agentrouter_proxy.sh

      - name: 执行 AgentRouter 签到
        env:
          AGENTROUTER_EMAIL: ${{ secrets.AGENTROUTER_EMAIL }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
          CHECKIN_HEADLESS: false
          CHECKIN_HUMANIZE: true
          CHECKIN_HUMANIZE_AGENTROUTER: true
          CHECKIN_WAIT_TIMEOUT_MS: 180000
          DEBUG_MODE: ${{ env.DEBUG_MODE }}
        shell: bash
        run: |
          if [[ -z "${AGENTROUTER_EMAIL}" || -z "${AGENTROUTER_PASSWORD}" ]]; then
            echo "ERROR: AGENTROUTER_EMAIL or AGENTROUTER_PASSWORD is not configured"
            exit 1
          fi

          ANYROUTER_ACCOUNTS="$(python - <<'PY'
          import json
          import os

          print(json.dumps([{
              "name": "AgentRouter",
              "provider": "agentrouter",
              "email": os.environ["AGENTROUTER_EMAIL"],
              "password": os.environ["AGENTROUTER_PASSWORD"],
          }]))
          PY
          )"
          export ANYROUTER_ACCOUNTS
          xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run checkin.py

      - name: 上传调试截图
        if: always() && env.DEBUG_MODE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agentrouter-screenshots-${{ github.run_id }}
          path: checkin_screenshots/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: 停止代理
        if: always()
        run: bash scripts/stop_mihomo_proxy.sh
