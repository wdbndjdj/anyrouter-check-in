name: AgentRouter 自动签到


      - name: 缓存 CloakBrowser
        uses: actions/cache@v5
        with:
          path: ~/.cloakbrowser
          key: ${{ runner.os }}-cloakbrowser-v1
          restore-keys: |
            ${{ runner.os }}-cloakbrowser-


      - name: 安装 CloakBrowser
        run: uv run python -m cloakbrowser install


      - name: 配置代理
        env:
          PROXY_NODE_URI: ${{ secrets.AGENTROUTER_PROXY_NODE_URI }}
          PROXY_TEST_URL: https://agentrouter.org/login
          PROXY_STATUS_URL: https://agentrouter.org/api/status
          MIHOMO_VERSION: v1.19.27
          PROXY_REQUIRED: true
          PROXY_MAX_CANDIDATES: 160
          PROXY_CANDIDATE_TIMEOUT: 12
        run: bash scripts/setup_agentrouter_proxy.sh


      - name: 执行 AgentRouter 签到
        env:
          ANYROUTER_ACCOUNTS: ${{ secrets.AGENTROUTER_ACCOUNTS_V2 }}
          CHECKIN_HEADLESS: false
          CHECKIN_HUMANIZE: true
          CHECKIN_HUMANIZE_AGENTROUTER: true
          CHECKIN_WAIT_TIMEOUT_MS: 180000
          DEBUG_MODE: ${{ env.DEBUG_MODE }}
        shell: bash
        run: |
          if [[ -z "${ANYROUTER_ACCOUNTS}" ]]; then
            echo "ERROR: AGENTROUTER_ACCOUNTS_V2 is not configured"
            exit 1
          fi


          python - <<'PY'
          import json
          import os
          import re


          accounts = json.loads(os.environ["ANYROUTER_ACCOUNTS"])
          if not isinstance(accounts, list) or len(accounts) != 11:
              raise SystemExit("ERROR: expected exactly 11 AgentRouter accounts")


          names = []
          for account in accounts:
              if not isinstance(account, dict):
                  raise SystemExit("ERROR: each account must be an object")
              name = account.get("name")
              if not isinstance(name, str) or not re.fullmatch(r"agentrouter-\d{2}", name):
                  raise SystemExit("ERROR: invalid account alias")
              if account.get("provider") != "agentrouter":
                  raise SystemExit("ERROR: invalid provider")
              for key in ("email", "password"):
                  value = account.get(key)
                  if not isinstance(value, str) or not value:
                      raise SystemExit(f"ERROR: missing {key}")
                  escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::add-mask::{escaped}")
              names.append(name)


          expected_names = [f"agentrouter-{index:02d}" for index in range(1, 12)]
          if names != expected_names:
              raise SystemExit("ERROR: account aliases or order are invalid")
          print("Validated AgentRouter accounts: count=11")
          PY
          xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run checkin.py


      - name: 上传调试截图
        if: always() && env.DEBUG_MODE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agentrouter-screenshots-${{ github.run_id }}
          path: checkin_screenshots/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7


      - name: 停止代理
        if: always()
        run: bash scripts/stop_mihomo_proxy.sh

